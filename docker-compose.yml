name: peelen-ms-be

services:
  app:
    image: peelen-ms-be:${IMAGE_TAG:-latest}
    container_name: peelen-ms-be
    restart: unless-stopped
    env_file: .env
    stop_grace_period: 30s
    networks: [peelen]
    # Dibuka publik untuk testing lewat Postman. HTTP polos: tutup lagi (atau pindah
    # ke subdomain HTTPS lewat nginx Mailcow) sebelum dipakai production.
    ports: ["8082:8080"]

# Dibuat manual sekali di server, supaya DB bisa di-connect sebelum deploy pertama:
#   docker network create --subnet 172.30.10.0/24 peelen-network
# Subnet dipatok supaya TRUSTED_PROXY_CIDRS di .env bisa diisi pasti.
networks:
  peelen:
    external: true
    name: peelen-network
