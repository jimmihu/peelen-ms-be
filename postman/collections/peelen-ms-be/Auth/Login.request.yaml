$kind: http-request
url: "{{base_url}}/api/v1/auth/login"
method: POST
headers:
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "username": "{{username}}",
      "password": "{{password}}"
    }
auth:
  type: noauth
scripts:
  - type: afterResponse
    code: |-
      if (pm.response.code === 200) {
        const body = pm.response.json();
        pm.collectionVariables.set('access_token', body.access_token);
        const rt = pm.cookies.get('refresh_token');
        if (rt) pm.collectionVariables.set('refresh_token', rt);
      }
    language: text/javascript
order: 1000
