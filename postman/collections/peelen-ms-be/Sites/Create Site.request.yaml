$kind: http-request
url: "{{base_url}}/api/v1/sites"
method: POST
headers:
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "code": "SITE001",
      "name": "Site Example",
      "site_type": "warehouse"
    }
scripts:
  - type: afterResponse
    code: |-
      if (pm.response.code === 201) {
        pm.collectionVariables.set('site_id', pm.response.json().site.id);
      }
    language: text/javascript
order: 3000
