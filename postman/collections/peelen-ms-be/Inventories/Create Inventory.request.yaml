$kind: http-request
description: "Create inventory with multipart/form-data. Image file is optional (max 5MB, formats: jpg, png, webp)"
url: "{{base_url}}/api/v1/inventories"
method: POST
body:
  type: form-data
  content:
    - key: vendor_id
      value: "{{vendor_id}}"
      type: text
    - key: item
      value: "Sample Item"
      type: text
    - key: jenis_item
      value: "Equipment"
      type: text
    - key: qty
      value: "10"
      type: text
    - key: status_condition
      value: "GOOD"
      type: text
    - key: image
      value: ""
      type: file
      disabled: true
scripts:
  - type: afterResponse
    code: |-
      if (pm.response.code === 201) {
        pm.collectionVariables.set('inventory_id', pm.response.json().data.id);
      }
    language: text/javascript
order: 3000
