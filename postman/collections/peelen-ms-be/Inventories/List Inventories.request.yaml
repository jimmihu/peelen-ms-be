$kind: http-request
description: "Filter options: vendor_id, site_id, status (default: ACTIVE), status_condition, q (search query), page, limit (1-100)"
url: "{{base_url}}/api/v1/inventories"
method: GET
params:
  - key: page
    value: "1"
  - key: limit
    value: "20"
  - key: vendor_id
    value: "{{vendor_id}}"
    disabled: true
  - key: site_id
    value: "{{site_id}}"
    disabled: true
  - key: status
    value: "ACTIVE"
    disabled: true
  - key: status_condition
    value: ""
    disabled: true
  - key: q
    value: ""
    disabled: true
order: 1000
