$kind: http-request
description: "Update inventory with multipart/form-data. Image file is optional (max 5MB, formats: jpg, png, webp)"
url: "{{base_url}}/api/v1/inventories/{{inventory_id}}"
method: PATCH
body:
  type: form-data
  content:
    - key: qty
      value: "15"
      type: text
    - key: status_condition
      value: "GOOD"
      type: text
    - key: status
      value: "ACTIVE"
      type: text
    - key: image
      value: ""
      type: file
      disabled: true
order: 4000
