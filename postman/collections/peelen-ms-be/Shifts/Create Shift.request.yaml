$kind: http-request
url: "{{base_url}}/api/v1/shifts"
method: POST
headers:
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "shift": "DAY",
      "start_time": "06:00",
      "end_time": "14:00"
    }
scripts:
  - type: afterResponse
    code: |-
      if (pm.response.code === 201) {
        pm.collectionVariables.set('shift', pm.response.json().data.shift);
      }
    language: text/javascript
order: 3000
