$kind: http-request
description: "Status IN_PROGRESS (default) atau COMPLETED. COMPLETED wajib evidence_after dan closed_date. status_revisi diisi server: SUBMITTED bila dikirim/diubah setelah shift selesai. Upload susulan terbuka sampai shift yang sama dimulai hari berikutnya (setelah itu 409 REPORT_UPLOAD_CLOSED). Untuk upload foto langsung pakai request (Upload Photos)."
url: "{{base_url}}/api/v1/pipeline-reports"
method: POST
headers:
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "pipeline_item_id": "{{pipeline_item_id}}",
      "shift": "DAY",
      "report_date": "2026-10-15",
      "status": "IN_PROGRESS",
      "evidence_before": null,
      "open_date": "2026-10-15T09:00:00+07:00",
      "notes": "Sample report notes"
    }
scripts:
  - type: afterResponse
    code: |-
      if (pm.response.code === 201) {
        pm.collectionVariables.set('pipeline_report_id', pm.response.json().data.id);
      }
    language: text/javascript
order: 3000
