$kind: http-request
url: "{{base_url}}/api/v1/pipeline-reports"
method: POST
headers:
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "pipeline_item_id": "{{pipeline_item_id}}",
      "shift": "{{shift}}",
      "report_date": "2024-01-15",
      "status": "OK",
      "status_revisi": "",
      "evidence_before": null,
      "evidence_after": null,
      "notes": "Sample report notes"
    }
scripts:
  - type: afterResponse
    code: |-
      if (pm.response.code === 201) {
        pm.collectionVariables.set('pipeline_report_id', pm.response.json().data.id);
      }
    language: text/javascript
order: 3000
