$kind: http-request
description: "Upload foto susulan, misalnya setelah dapat sinyal. multipart/form-data. Foto disimpan ke MinIO; untuk JPEG, jam EXIF kamera menjadi open_date (evidence_before) dan closed_date (evidence_after), mengalahkan nilai dari client. Tanpa EXIF dipakai open_date/closed_date (RFC 3339). Jam harus antara 1 jam sebelum shift mulai dan saat upload. Maks 5 MB per foto."
url: "{{base_url}}/api/v1/pipeline-reports/{{pipeline_report_id}}"
method: PATCH
body:
  type: form-data
  content:
    - key: status
      value: "COMPLETED"
      type: text
    - key: evidence_after
      value: ""
      type: file
    - key: notes
      value: "Foto after diunggah setelah dapat sinyal"
      type: text
      disabled: true
    - key: closed_date
      value: "2026-10-15T09:40:00+07:00"
      type: text
      disabled: true
order: 6000
