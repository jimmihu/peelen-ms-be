$kind: http-request
description: "multipart/form-data. Foto disimpan ke MinIO; untuk JPEG, jam EXIF kamera menjadi open_date (evidence_before) dan closed_date (evidence_after), mengalahkan nilai dari client. Tanpa EXIF dipakai open_date/closed_date (RFC 3339). Jam harus antara 1 jam sebelum shift mulai dan saat upload. Maks 5 MB per foto."
url: "{{base_url}}/api/v1/pipeline-reports"
method: POST
body:
  type: form-data
  content:
    - key: pipeline_item_id
      value: "{{pipeline_item_id}}"
      type: text
    - key: shift
      value: "DAY"
      type: text
    - key: report_date
      value: "2026-10-15"
      type: text
    - key: status
      value: "COMPLETED"
      type: text
    - key: evidence_before
      value: ""
      type: file
    - key: evidence_after
      value: ""
      type: file
    - key: notes
      value: "Area bersih dan aman"
      type: text
    - key: note_category
      value: "NEAR_MISS"
      type: text
      disabled: true
    - key: open_date
      value: "2026-10-15T09:00:00+07:00"
      type: text
      disabled: true
    - key: closed_date
      value: "2026-10-15T09:40:00+07:00"
      type: text
      disabled: true
scripts:
  - type: afterResponse
    code: |-
      if (pm.response.code === 201) {
        pm.collectionVariables.set('pipeline_report_id', pm.response.json().data.id);
      }
    language: text/javascript
order: 5000
