$kind: http-request
description: "Hanya WORKER pemilik report. Status IN_PROGRESS (default) atau COMPLETED. COMPLETED wajib evidence_after dan closed_date. status_revisi diisi server: SUBMITTED bila dikirim/diubah setelah shift selesai. Upload susulan terbuka sampai shift yang sama dimulai hari berikutnya (setelah itu 409 REPORT_UPLOAD_CLOSED). Report COMPLETED tidak bisa dikembalikan ke IN_PROGRESS."
url: "{{base_url}}/api/v1/pipeline-reports/{{pipeline_report_id}}"
method: PATCH
headers:
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "status": "COMPLETED",
      "evidence_after": "pipeline-reports/sample/after.jpg",
      "closed_date": "2026-10-15T09:40:00+07:00",
      "notes": "Updated report notes"
    }
order: 4000
