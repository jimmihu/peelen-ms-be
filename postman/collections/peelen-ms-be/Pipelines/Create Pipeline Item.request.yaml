$kind: http-request
description: "Create a new item within a specific pipeline"
url: "{{base_url}}/api/v1/pipelines/{{pipeline_id}}/items"
method: POST
headers:
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "item_id": "{{item_id}}",
      "sort_order": 1
    }
scripts:
  - type: afterResponse
    code: |-
      if (pm.response.code === 201) {
        pm.collectionVariables.set('pipeline_item_id', pm.response.json().data.id);
      }
    language: text/javascript
order: 7000
