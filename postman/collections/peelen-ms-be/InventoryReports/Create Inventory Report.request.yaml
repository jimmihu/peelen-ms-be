$kind: http-request
url: "{{base_url}}/api/v1/inventory-reports"
method: POST
headers:
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "vendor_id": "{{vendor_id}}",
      "inventory_id": null,
      "report_type": "DAMAGE",
      "evidence": null,
      "description": "Sample inventory report description",
      "status": "PENDING"
    }
scripts:
  - type: afterResponse
    code: |-
      if (pm.response.code === 201) {
        pm.collectionVariables.set('inventory_report_id', pm.response.json().data.id);
      }
    language: text/javascript
order: 3000
