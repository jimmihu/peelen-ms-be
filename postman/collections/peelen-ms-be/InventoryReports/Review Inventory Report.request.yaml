$kind: http-request
description: "Review an inventory report. Status options: APPROVED, REJECTED"
url: "{{base_url}}/api/v1/inventory-reports/{{inventory_report_id}}/review"
method: PATCH
headers:
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "status": "APPROVED",
      "review_reason": "Report verified and approved"
    }
order: 4000
