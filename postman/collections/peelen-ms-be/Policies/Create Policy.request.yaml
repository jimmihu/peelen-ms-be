$kind: http-request
description: "Create policy with multipart/form-data. PDF file is required (max 10MB)"
url: "{{base_url}}/api/v1/policies"
method: POST
body:
  type: form-data
  content:
    - key: vendor_id
      value: "{{vendor_id}}"
      type: text
    - key: name
      value: "Sample Policy"
      type: text
    - key: file
      value: ""
      type: file
scripts:
  - type: afterResponse
    code: |-
      if (pm.response.code === 201) {
        pm.collectionVariables.set('policy_id', pm.response.json().data.id);
      }
    language: text/javascript
order: 3000
