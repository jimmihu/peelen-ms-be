$kind: http-request
url: "{{base_url}}/api/v1/items"
method: POST
headers:
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "vendor_id": "{{vendor_id}}",
      "name": "Sample Item",
      "description": "Sample item description"
    }
scripts:
  - type: afterResponse
    code: |-
      if (pm.response.code === 201) {
        pm.collectionVariables.set('item_id', pm.response.json().data.id);
      }
    language: text/javascript
order: 3000
