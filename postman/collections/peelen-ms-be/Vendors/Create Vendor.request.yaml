$kind: http-request
url: "{{base_url}}/api/v1/vendors"
method: POST
headers:
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "code": "VENDOR001",
      "name": "Vendor Example",
      "site_ids": []
    }
scripts:
  - type: afterResponse
    code: |-
      if (pm.response.code === 201) {
        pm.collectionVariables.set('vendor_id', pm.response.json().vendor.id);
      }
    language: text/javascript
order: 3000
