$kind: http-request
description: "Get daily report. Filter options: date (defaults to today), site_id, vendor_id"
url: "{{base_url}}/api/v1/reports/daily"
method: GET
params:
  - key: date
    value: ""
    disabled: true
  - key: site_id
    value: "{{site_id}}"
    disabled: true
  - key: vendor_id
    value: "{{vendor_id}}"
    disabled: true
order: 2000
