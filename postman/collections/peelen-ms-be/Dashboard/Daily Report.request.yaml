$kind: http-request
description: "Get daily report. Filter options: date (defaults to today), site_id, vendor_id. Per pipeline: task_count, report_count, completed_count, in_progress_count, late_upload_count."
url: "{{base_url}}/api/v1/reports/daily"
method: GET
params:
  - key: date
    value: ""
    disabled: true
  - key: site_id
    value: "{{site_id}}"
    disabled: true
  - key: vendor_id
    value: "{{vendor_id}}"
    disabled: true
order: 2000
