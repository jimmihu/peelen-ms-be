$kind: http-request
description: "user_id harus WORKER aktif dengan scope vendor pemilik pipeline. Penugasan nonaktif dengan kombinasi yang sama akan diaktifkan kembali; yang masih aktif mengembalikan 409."
url: "{{base_url}}/api/v1/assignments"
method: POST
headers:
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "pipeline_item_id": "{{pipeline_item_id}}",
      "user_id": "{{user_id}}",
      "shift": "pagi"
    }
scripts:
  - type: afterResponse
    code: |-
      if (pm.response.code === 201) {
        pm.collectionVariables.set('assignment_id', pm.response.json().data.id);
      }
    language: text/javascript
order: 2000
